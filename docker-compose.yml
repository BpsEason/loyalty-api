services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: loyalty-app
    restart: unless-stopped
    working_dir: /var/www

    stdin_open: true
    tty: true

    volumes:
      - ./:/var/www
      - vendor:/var/www/vendor

    depends_on:
      redis:
        condition: service_healthy

    networks:
      - loyalty-network

  nginx:
    image: nginx:alpine
    container_name: loyalty-nginx
    restart: unless-stopped
    ports:
      - "8088:80"

    volumes:
      - ./:/var/www
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro

    depends_on:
      - app

    networks:
      - loyalty-network

  queue-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: loyalty-queue-worker
    restart: unless-stopped
    working_dir: /var/www

    stdin_open: true
    tty: true

    volumes:
      - ./:/var/www
      - vendor:/var/www/vendor

    depends_on:
      redis:
        condition: service_healthy

    command: php artisan queue:work --tries=3

    networks:
      - loyalty-network

  redis:
    image: redis:7-alpine
    container_name: loyalty-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis-data:/data

    networks:
      - loyalty-network

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  reverb:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: loyalty-reverb
    restart: unless-stopped
    working_dir: /var/www

    stdin_open: true
    tty: true

    volumes:
      - ./:/var/www
      - vendor:/var/www/vendor

    depends_on:
      redis:
        condition: service_healthy

    command: php artisan reverb:start --host=0.0.0.0 --port=8080

    ports:
      - "8888:8080"

    networks:
      - loyalty-network

networks:
  loyalty-network:
    driver: bridge

volumes:
  vendor:
    driver: local

  redis-data:
    driver: local